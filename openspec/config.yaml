schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: chat_notebook.
  Version control: local Subversion (SVN); this directory is a trunk working copy.
  Use svn status/diff/update/commit rather than Git commands.
  Native Android stack: Kotlin, Jetpack Compose, Material 3, MVVM + Repository, Coroutines/Flow, Room, Retrofit/OkHttp, Kotlin Serialization, Gradle Kotlin DSL.
  The app currently has only a buildable UI scaffold; see the active change for planned behavior and storage.
  Build with gradlew.bat assembleDebug; run testDebugUnitTest and lintDebug.
  Records must be stored as maintainable files in a user-selected local directory that survives uninstall; Room may serve as a rebuildable index.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
